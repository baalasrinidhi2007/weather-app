<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Weather App</title>

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial;
    }

    body{
      height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      background:linear-gradient(135deg,#4facfe,#00f2fe);
    }

    .container{

      background:white;
      width:350px;
      padding:30px;
      border-radius:20px;
      text-align:center;

      box-shadow:0 10px 30px rgba(0,0,0,0.2);

      animation:fadeIn 1s;
    }

    @keyframes fadeIn{

      from{
        opacity:0;
        transform:translateY(20px);
      }

      to{
        opacity:1;
        transform:translateY(0);
      }
    }

    h1{
      margin-bottom:20px;
      color:#333;
    }

    .search-box{
      display:flex;
      gap:10px;
    }

    input{

      flex:1;
      padding:12px;
      border:none;
      border-radius:10px;
      background:#f1f1f1;
      outline:none;
      font-size:16px;
    }

    button{

      padding:12px 15px;
      border:none;
      border-radius:10px;

      background:#4facfe;
      color:white;

      cursor:pointer;

      transition:0.3s;
      font-size:16px;
    }

    button:hover{
      background:#008cff;
      transform:scale(1.05);
    }

    .weather{

      margin-top:25px;
      color:#333;
    }

    .temp{
      font-size:45px;
      margin:10px 0;
    }

    .details{

      margin-top:20px;

      display:grid;
      grid-template-columns:1fr 1fr;
      gap:15px;
    }

    .card{

      background:#f5f5f5;
      padding:15px;
      border-radius:12px;
    }

    .emoji{
      font-size:25px;
    }

  </style>

</head>

<body>

<div class="container">

  <h1>🌦 Weather App</h1>

  <div class="search-box">

    <input
      type="text"
      id="city"
      placeholder="Enter city name"
    >

    <button onclick="getWeather()">
      🔍
    </button>

  </div>

  <div id="weather"></div>

</div>

<script>

const apiKey =
"c7a04566d9305ea496d3d075bd5e2e21";

async function getWeather(){

  const city =
    document.getElementById("city").value;

  const weatherDiv =
    document.getElementById("weather");

  if(city===""){

    weatherDiv.innerHTML =
      "<p>Please enter a city</p>";

    return;
  }

  const url =
`https://api.openweathermap.org/data/2.5/weather?q=${city}&appid=${apiKey}&units=metric`;

  try{

    const response = await fetch(url);

    const data = await response.json();

    if(data.cod != 200){

      weatherDiv.innerHTML =
        "<p>❌ City not found</p>";

      return;
    }

    weatherDiv.innerHTML = `

      <div class="weather">

        <h2>${data.name}, ${data.sys.country}</h2>

        <div class="temp">
          ${Math.round(data.main.temp)}°C
        </div>

        <h3>
          ${data.weather[0].main}
        </h3>

        <p>
          ${data.weather[0].description}
        </p>

        <div class="details">

          <div class="card">
            <div class="emoji">💧</div>
            <p>Humidity</p>
            <h3>${data.main.humidity}%</h3>
          </div>

          <div class="card">
            <div class="emoji">🌬</div>
            <p>Wind</p>
            <h3>${data.wind.speed} m/s</h3>
          </div>

          <div class="card">
            <div class="emoji">🌡</div>
            <p>Feels Like</p>
            <h3>${Math.round(data.main.feels_like)}°C</h3>
          </div>

          <div class="card">
            <div class="emoji">👁</div>
            <p>Visibility</p>
            <h3>${data.visibility/1000} km</h3>
          </div>

        </div>

      </div>

    `;

  }

  catch(error){

    weatherDiv.innerHTML =
      "<p>⚠ Error fetching weather</p>";
  }

}

document
.getElementById("city")
.addEventListener("keypress", function(event){

  if(event.key==="Enter"){
    getWeather();
  }

});

</script>

</body>
</html>
